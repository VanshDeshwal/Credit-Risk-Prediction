name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '_config.yml'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (for any build tools if needed)
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package*.json'
        continue-on-error: true

      - name: Install dependencies (if package.json exists)
        run: |
          if [ -f "frontend/package.json" ]; then
            cd frontend && npm ci
          else
            echo "No package.json found, skipping npm install"
          fi
        continue-on-error: true

      - name: Build frontend (if build script exists)
        run: |
          if [ -f "frontend/package.json" ] && npm run build --prefix frontend 2>/dev/null; then
            echo "Build completed"
          else
            echo "No build script found or build not needed"
          fi
        continue-on-error: true

      - name: Prepare deployment files
        run: |
          # Create deployment directory
          mkdir -p _site
          
          # Copy frontend files to deployment directory
          cp -r frontend/* _site/
          
          # Ensure CNAME file is in the root
          if [ -f "_site/CNAME" ]; then
            echo "CNAME file found in frontend"
          else
            echo "creditpredict.vanshdeshwal.dev" > _site/CNAME
          fi
          
          # List files for debugging
          echo "Files in _site directory:"
          ls -la _site/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
